name: Source CI

on:
  push:
  pull_request:

concurrency:
  group: source-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run demo:contest
      - run: npm run demo:hybrid
      - run: npm run test:cloudflare
      - run: npm audit --omit=dev --audit-level=high

  kujo-release-gate:
    needs: deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5 # amd64 Linux image for Postgres 16
        env:
          POSTGRES_USER: source
          POSTGRES_PASSWORD: sourcepass
          POSTGRES_DB: source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U source -d source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:scale
      - run: node bin/source.js help
      - run: docker build --tag source:local-audit .
      - name: Live Postgres fleet gate
        env:
          SOURCE_TEST_DATABASE_URL: postgresql://source:sourcepass@127.0.0.1:5432/source
          SOURCE_LIVE_AGENTS: 5000
        run: npm run test:postgres
      - name: Two-container writer failover gate
        env:
          SOURCE_TEST_DATABASE_URL: postgresql://source:sourcepass@127.0.0.1:5432/source
          SOURCE_CONTAINER_DATABASE_URL: postgresql://source:sourcepass@host.docker.internal:5432/source
          SOURCE_CONTAINER_IMAGE: source:local-audit
        run: npm run test:container
