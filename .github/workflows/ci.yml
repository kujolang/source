name: Source CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  kujo-release-gate:
    needs: deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: source
          POSTGRES_PASSWORD: sourcepass
          POSTGRES_DB: source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U source -d source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:scale
      - run: node bin/source.js help
      - run: docker build --tag source:local-audit .
      - name: Live Postgres fleet gate
        env:
          SOURCE_TEST_DATABASE_URL: postgresql://source:sourcepass@127.0.0.1:5432/source
          SOURCE_LIVE_AGENTS: 5000
        run: npm run test:postgres
      - name: Two-container writer failover gate
        env:
          SOURCE_TEST_DATABASE_URL: postgresql://source:sourcepass@127.0.0.1:5432/source
          SOURCE_CONTAINER_DATABASE_URL: postgresql://source:sourcepass@host.docker.internal:5432/source
          SOURCE_CONTAINER_IMAGE: source:local-audit
        run: npm run test:container
