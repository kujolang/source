objective: "Audit and harden Source for secure, agent-facing decentralized Git hosting with Kujo evidence integration."
checklist_file: ""
max_iterations: 8
max_no_progress: 2
max_consecutive_failures: 3

allowed_actions:
  - read_files
  - edit_files
  - run_tests
  - commit_local_changes

blocked_actions:
  - deploy
  - destructive_cleanup
  - production_config_change

eval_gates:
  - id: php_tests
    command: "cd connector-plugin && composer test"
    required: true
    when_files_match:
      - "connector-plugin/**"

  - id: node_tests
    command: "npm test"
    required: true
    when_files_match:
      - "src/**"

  - id: diff_check
    command: "git diff --check"
    required: true

commit:
  enabled: true
  strategy: small_meaningful
  push: true

memory:
  enabled: true
  provider: strata
  project: "Agent Notes"
  mode: consolidate
  retrieval_tests: true
