# fence.toml - architecture boundary contract
# Generated by `fence init`. Edit to match your project.
# Docs: run `kujo run fence.kujo -- help`.

version = 1
source_roots = ["src"]
default_severity = "error"
fail_on = "error"
unknown_dependency_policy = "warn"

[scan]
include = [
  "src/**/*.ts",
  "src/**/*.tsx",
  "src/**/*.js",
  "src/**/*.jsx",
  "src/**/*.py",
  "src/**/*.rs",
  "src/**/*.php",
  "src/**/*.go",
  "src/**/*.kujo"
]
exclude = [
  "node_modules/**",
  "vendor/**",
  "dist/**",
  "build/**",
  "coverage/**",
  ".git/**",
  "**/*.min.js",
  "**/*.generated.*"
]

[aliases]
"@" = "src"
"~" = "src"

[zones.transport]
paths = ["src/api.js", "src/git-http.js", "src/web.js", "src/submit.js", "src/auth.js"]
can_depend_on = ["core", "storage", "execution", "shared"]
cannot_depend_on = []
severity = "error"

[zones.core]
paths = ["src/source.js", "src/domain.js", "src/capability.js", "src/policy.js", "src/ids.js"]
can_depend_on = ["storage", "execution", "shared"]
cannot_depend_on = ["transport"]
severity = "error"

[zones.storage]
paths = ["src/store.js", "src/sqlite-store.js", "src/postgres-store.js", "src/job-queue.js", "src/ratelimit.js"]
can_depend_on = ["core", "shared"]
cannot_depend_on = ["transport", "execution"]
severity = "error"

[zones.execution]
paths = ["src/action-runner.js", "src/worker.js", "src/integrations/**"]
can_depend_on = ["core", "storage", "shared"]
cannot_depend_on = ["transport"]
severity = "error"

[zones.shared]
paths = ["src/concurrency.js", "src/scan.js", "src/git.js", "src/writer-lease.js"]
can_depend_on = []
cannot_depend_on = ["transport", "core", "storage", "execution"]
severity = "warning"
